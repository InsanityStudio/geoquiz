<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=0, minimal-ui">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Flags of the World Quiz</title>
    <style>
        :root {
            --bg-color: #33ccff;
            --text-color: #000;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --input-bg: #ffffff;
            --input-text: #222;
            --input-border: #888;
            --shadow-color: #777;
            --grid-filter: blur(15px) opacity(0.8);
        }

        body.dark-mode {
            --bg-color: #0f1722;
            --text-color: #ffffff;
            --glass-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --input-bg: #1e293b;
            --input-text: #ffffff;
            --input-border: #475569;
            --shadow-color: #0f172a;
            --grid-filter: blur(15px) opacity(0.4) brightness(0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-color);
            font-family: Arial, Helvetica, sans-serif;
            user-select: none;
            transition: background-color 0.3s;
        }

        /* BACKGROUND GRID - BLURRED */
        #flag-grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            grid-auto-rows: 53px;
            overflow: hidden;
            filter: var(--grid-filter);
            transform: scale(1.05); /* prevents white edges from blur */
            transition: filter 0.3s;
            pointer-events: none;
        }

        #flag-grid-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* GAME UI LAYOUT */
        #game-ui {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* TOP BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-color);
            font-weight: bold;
            font-size: 20px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .back-btn {
            font-size: 26px;
            cursor: pointer;
            transition: transform 0.1s;
            width: 40px;
        }

        .back-btn:active {
            transform: scale(0.9);
        }

        .top-stats {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .theme-toggle {
            width: 26px;
            height: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .theme-toggle svg {
            width: 24px;
            height: 24px;
        }

        .theme-toggle .sun-icon { display: none; }
        body.dark-mode .theme-toggle .sun-icon { display: block; }
        body.dark-mode .theme-toggle .moon-icon { display: none; }

        /* MIDDLE - FLAG AREA (FILLS ALL SPACE) */
        .flag-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            min-height: 0; 
            position: relative;
        }

        .flag-area img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6));
            transition: opacity 0.3s;
        }

        /* BOTTOM BAR - PINNED TO VERY BOTTOM */
        .bottom-bar {
            position: relative;
            padding: 15px 25px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }

        /* FLOATING FEEDBACK */
        .feedback {
            position: absolute;
            bottom: calc(100% + 15px); /* Floats above the input box */
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            color: var(--text-color);
            pointer-events: none; /* Clicks pass through to the flag */
        }

        .feedback.correct { color: #22c55e; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
        .feedback.wrong { color: #ef4444; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
        .feedback .hint { font-size: 16px; color: #fff; opacity: 1; font-weight: normal; text-shadow: 0 1px 4px #000; }
        .feedback .reveal { font-size: 32px; color: #f59e0b; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }

        /* INPUT BOX */
        #answer-input {
            width: 100%;
            max-width: 600px;
            height: 65px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            box-shadow: 0 4px 0 var(--shadow-color), 0 6px 12px rgba(0,0,0,0.2);
            font-family: inherit;
            font-size: 24px;
            font-weight: bold;
            color: var(--input-text);
            text-align: center;
            outline: none;
            padding: 0 15px;
            transition: all 0.3s;
        }

        #answer-input::placeholder {
            color: #888;
        }

        #answer-input:disabled {
            opacity: 0.7;
            box-shadow: 0 1px 0 var(--shadow-color);
            transform: translateY(3px);
        }

        /* MAIN MENU */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 20;
            transition: all 0.3s;
        }

        #main-menu h1 {
            color: var(--text-color);
            font-size: 42px;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            line-height: 1.2;
        }

        .menu-btn {
            width: 300px;
            height: 65px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            box-shadow: 0 4px 0 var(--shadow-color), 0 6px 12px rgba(0,0,0,0.2);
            font-family: inherit;
            font-size: 22px;
            font-weight: bold;
            color: var(--input-text);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s, background 0.3s;
        }

        .menu-btn:active {
            box-shadow: 0 1px 0 var(--shadow-color);
            transform: translateY(3px);
        }

        .back-to-menu-btn {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Background Grid -->

        { code: 'tj', name: 'Tajikistan', aliases: ['tajikistan'] },
        { code: 'tz', name: 'Tanzania', aliases: ['tanzania'] },
        { code: 'th', name: 'Thailand', aliases: ['thailand'] },
        { code: 'tl', name: 'Timor-Leste', aliases: ['timor-leste', 'east timor', 'timor leste'] },
        { code: 'tg', name: 'Togo', aliases: ['togo'] },
        { code: 'to', name: 'Tonga', aliases: ['tonga'] },
        { code: 'tt', name: 'Trinidad and Tobago', aliases: ['trinidad and tobago', 'trinidad', 'tobago'] },
        { code: 'tn', name: 'Tunisia', aliases: ['tunisia'] },
        { code: 'tr', name: 'Turkey', aliases: ['turkey', 'türkiye', 'turkiye'] },
        { code: 'tm', name: 'Turkmenistan', aliases: ['turkmenistan'] },
        { code: 'tv', name: 'Tuvalu', aliases: ['tuvalu'] },
        { code: 'ug', name: 'Uganda', aliases: ['uganda'] },
        { code: 'ua', name: 'Ukraine', aliases: ['ukraine'] },
        { code: 'ae', name: 'United Arab Emirates', aliases: ['united arab emirates', 'uae'] },
        { code: 'gb', name: 'United Kingdom', aliases: ['united kingdom', 'uk', 'britain', 'great britain'] },
        { code: 'us', name: 'United States', aliases: ['united states', 'usa', 'us', 'america', 'united states of america'] },
        { code: 'uy', name: 'Uruguay', aliases: ['uruguay'] },
        { code: 'uz', name: 'Uzbekistan', aliases: ['uzbekistan'] },
        { code: 'vu', name: 'Vanuatu', aliases: ['vanuatu'] },
        { code: 'va', name: 'Vatican City', aliases: ['vatican city', 'vatican', 'holy see'] },
        { code: 've', name: 'Venezuela', aliases: ['venezuela'] },
        { code: 'vn', name: 'Vietnam', aliases: ['vietnam', 'viet nam'] },
        { code: 'ye', name: 'Yemen', aliases: ['yemen'] },
        { code: 'zm', name: 'Zambia', aliases: ['zambia'] },
        { code: 'zw', name: 'Zimbabwe', aliases: ['zimbabwe'] }
    ];

    // ---------------------------------------------------------------------------
    // Build list of all valid strings for prefix checking
    // ---------------------------------------------------------------------------
    const ALL_COUNTRY_STRINGS = [];
    COUNTRIES.forEach(c => {
        ALL_COUNTRY_STRINGS.push(normalize(c.name));
        c.aliases.forEach(a => ALL_COUNTRY_STRINGS.push(normalize(a)));
    });
    const UNIQUE_COUNTRY_STRINGS = [...new Set(ALL_COUNTRY_STRINGS)];

    // ---------------------------------------------------------------------------
    // Background Generation
    // ---------------------------------------------------------------------------
    function generateBackground() {
        const bgContainer = document.getElementById('flag-grid-bg');
        const codes = COUNTRIES.map(c => c.code);
        const totalFlags = 3000; 
        let html = '';
        
        for (let i = 0; i < totalFlags; i++) {
            const randomCode = codes[Math.floor(Math.random() * codes.length)];
            html += `<img src="https://flagcdn.com/w80/${randomCode}.png" alt="" loading="eager">`;
        }
        bgContainer.innerHTML = html;
    }

    // ---------------------------------------------------------------------------
    // Game State
    // ---------------------------------------------------------------------------
    let remaining = [];
    let current = null;
    let score = 0;
    let currentIndex = 0;
    let totalQuestions = 25;
    let isPlaying = false;
    
    let answered = false;
    let answeredCorrect = false;

    // DOM Elements
    const flagImg = document.getElementById('flag-img');
    const answerInput = document.getElementById('answer-input');
    const feedbackEl = document.getElementById('feedback');
    const scoreDisplay = document.getElementById('score-display');
    const progressDisplay = document.getElementById('progress-display');
    
    const mainMenu = document.getElementById('main-menu');
    const gameArea = document.getElementById('game-area');
    const backBtn = document.getElementById('back-btn');
    const themeToggle = document.getElementById('theme-toggle');

    // ---------------------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------------------
    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function normalize(str) {
        return str.trim().toLowerCase().replace(/[-]/g, ' ').replace(/\s+/g, ' ');
    }

    function flagUrl(code) {
        return 'https://flagcdn.com/w320/' + code + '.png';
    }

    const preloaded = new Set();
    function preloadFlag(code) {
        if (preloaded.has(code)) return;
        preloaded.add(code);
        const img = new Image();
        img.src = flagUrl(code);
    }

    function preloadUpcoming() {
        for (let i = 0; i < Math.min(5, remaining.length); i++) {
            preloadFlag(remaining[remaining.length - 1 - i].code);
        }
    }

    function isPrefixOfAnother(guess) {
        return UNIQUE_COUNTRY_STRINGS.some(str => str !== guess && str.startsWith(guess));
    }

    // ---------------------------------------------------------------------------
    // Theme
    // ---------------------------------------------------------------------------
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('flagQuizTheme', isDark ? 'dark' : 'light');
    }

    function loadTheme() {
        const saved = localStorage.getItem('flagQuizTheme');
        if (saved === 'dark') {
            document.body.classList.add('dark-mode');
        }
    }

    // ---------------------------------------------------------------------------
    // Menu & Game Flow
    // ---------------------------------------------------------------------------
    function showMenu() {
        isPlaying = false;
        mainMenu.classList.remove('hidden');
        gameArea.classList.add('hidden');
    }

    function startGame(mode) {
        isPlaying = true;
        mainMenu.classList.add('hidden');
        gameArea.classList.remove('hidden');
        
        totalQuestions = mode === 'all' ? COUNTRIES.length : parseInt(mode);
        remaining = shuffle(COUNTRIES);
        score = 0;
        currentIndex = 0;
        
        updateTopBar();
        preloadUpcoming();
        nextFlag();
    }

    function nextFlag() {
        if (currentIndex >= totalQuestions) {
            isPlaying = false;
            answered = true;
            answerInput.disabled = true;
            flagImg.src = 'https://flagcdn.com/w320/un.png';
            flagImg.style.opacity = '0.3';
            feedbackEl.className = 'feedback correct';
            feedbackEl.innerHTML = `
                <div class="reveal">Finished!</div>
                <div>Final Score: ${score} / ${totalQuestions}</div>
                <button class="menu-btn back-to-menu-btn" id="finish-menu-btn">Main Menu</button>
            `;
            document.getElementById('finish-menu-btn').addEventListener('click', showMenu);
            return;
        }

        if (remaining.length === 0) {
            remaining = shuffle(COUNTRIES);
        }

        current = remaining.pop();
        currentIndex++;
        answered = false;
        answeredCorrect = false;

        flagImg.src = flagUrl(current.code);
        flagImg.alt = 'Flag';
        flagImg.style.opacity = '1';

        answerInput.value = '';
        answerInput.disabled = false;
        feedbackEl.className = 'feedback';
        feedbackEl.innerHTML = '';
        
        updateTopBar();
        answerInput.focus();
        preloadUpcoming();
    }

    function updateTopBar() {
        scoreDisplay.textContent = `Score: ${score}`;
        progressDisplay.textContent = `${currentIndex}/${totalQuestions}`;
    }

    function isCorrectGuess(guess) {
        return (
            guess === normalize(current.name) ||
            current.aliases.some(a => normalize(a) === guess)
        );
    }

    function submitAnswer() {
        if (answered) {
            if (currentIndex < totalQuestions) {
                nextFlag();
            }
            return;
        }

        const guess = normalize(answerInput.value);
        if (!guess) return;

        answered = true;
        answerInput.disabled = true;

        if (isCorrectGuess(guess)) {
            answeredCorrect = true;
            score++;
            updateTopBar();
            feedbackEl.className = 'feedback correct';
            feedbackEl.innerHTML = `<div>✅ ${current.name}</div><div class="hint">Enter / Space for next</div>`;
        } else {
            answeredCorrect = false;
            feedbackEl.className = 'feedback wrong';
            feedbackEl.innerHTML = `<div>❌ Not quite</div><div class="reveal">${current.name}</div><div class="hint">↓ to override · Enter / Space for next</div>`;
        }
    }

    function overrideCorrect() {
        if (!answered || answeredCorrect || !isPlaying) return;
        answeredCorrect = true;
        score++;
        updateTopBar();
        feedbackEl.className = 'feedback correct';
        feedbackEl.innerHTML = `<div>⭐ Overridden — ${current.name}</div><div class="hint">Enter / Space for next</div>`;
    }

    // ---------------------------------------------------------------------------
    // Event Listeners
    // ---------------------------------------------------------------------------
    
    themeToggle.addEventListener('click', toggleTheme);

    document.querySelectorAll('.menu-btn[data-mode]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            startGame(e.target.dataset.mode);
        });
    });

    backBtn.addEventListener('click', showMenu);

    document.addEventListener('keydown', (e) => {
        if (!isPlaying) return;

        if (e.key === ' ' || e.code === 'Space') {
            if (answered) {
                e.preventDefault();
                if (currentIndex < totalQuestions) {
                    nextFlag();
                }
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (answered && !answeredCorrect) {
                overrideCorrect();
            }
        } else if (e.key === 'Enter') {
            e.preventDefault();
            submitAnswer();
        }
    });

    answerInput.addEventListener('input', () => {
        if (answered || !current || !isPlaying) return;
        const guess = normalize(answerInput.value);
        if (!guess) return;

        if (isCorrectGuess(guess)) {
            if (!isPrefixOfAnother(guess)) {
                submitAnswer();
            }
        }
    });

    // Initialize
    loadTheme();
    generateBackground();
    showMenu();
</script>

</body>
</html>
