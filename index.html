<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=0, minimal-ui">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>World Quiz</title>
    
    <!-- amCharts 5 Libraries for Map Mode -->
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/map.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

    <style>
        :root {
            --bg-color: #33ccff;
            --text-color: #000;
            --input-bg: #ffffff;
            --input-text: #222;
            --input-border: #888;
            --shadow-color: #777;
            --grid-filter: blur(15px) opacity(0.8);
            --text-shadow: 0 2px 6px rgba(255, 255, 255, 0.8), 0 1px 3px rgba(0, 0, 0, 0.3);
            --flag-scale: 1;
            --modal-bg: rgba(255, 255, 255, 0.95);
            --map-country-fill: #2c3e50;
            --map-country-stroke: #1a252f;
            --map-highlight-fill: #f1c40f;
        }

        body.dark-mode {
            --bg-color: #0f1722;
            --text-color: #ffffff;
            --input-bg: #1e293b;
            --input-text: #ffffff;
            --input-border: #475569;
            --shadow-color: #0f172a;
            --grid-filter: blur(15px) opacity(0.4) brightness(0.6);
            --text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0,0,0,0.5);
            --modal-bg: rgba(30, 41, 59, 0.95);
            --map-country-fill: #334155;
            --map-country-stroke: #1e293b;
            --map-highlight-fill: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            user-select: none;
            transition: background-color 0.3s;
        }

        /* BACKGROUND GRID */
        #flag-grid-bg {
            position: fixed;
            top: -50px;
            left: -50px;
            right: -50px;
            bottom: -50px;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            grid-auto-rows: 53px;
            overflow: hidden;
            filter: var(--grid-filter);
            pointer-events: none;
            transition: filter 0.3s;
        }

        #flag-grid-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* GAME UI LAYOUT */
        #game-ui {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* TOP BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: transparent;
            border-bottom: none;
            color: var(--text-color);
            font-weight: bold;
            font-size: 20px;
            text-shadow: var(--text-shadow);
            transition: all 0.3s;
            flex-shrink: 0;
            z-index: 15;
        }

        .back-btn {
            font-size: 26px;
            cursor: pointer;
            transition: transform 0.1s;
            width: 40px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .back-btn:active {
            transform: scale(0.9);
        }

        .top-stats {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .top-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .icon-btn {
            width: 26px;
            height: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .icon-btn:hover {
            transform: scale(1.1);
        }

        .icon-btn svg {
            width: 24px;
            height: 24px;
        }

        .theme-toggle .sun-icon { display: none; }
        body.dark-mode .theme-toggle .sun-icon { display: block; }
        body.dark-mode .theme-toggle .moon-icon { display: none; }

        /* MIDDLE - FLAG AREA */
        .flag-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            min-height: 0; 
            position: relative;
        }

        .flag-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6));
            transition: opacity 0.3s, transform 0.2s ease-out;
            transform: scale(var(--flag-scale));
        }

        /* MIDDLE - MAP AREA */
        #map-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            min-height: 0; 
            position: relative;
            z-index: 10;
        }

        #chartdiv {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
        }

        /* BOTTOM BAR */
        .bottom-bar {
            position: relative;
            padding: 15px 25px 25px;
            background: transparent;
            border-top: none;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s;
            z-index: 15;
        }

        /* FLOATING FEEDBACK */
        .feedback {
            position: absolute;
            bottom: calc(100% + 15px);
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            color: var(--text-color);
            text-shadow: var(--text-shadow);
            pointer-events: none;
        }

        .feedback.correct { color: #22c55e; }
        .feedback.wrong { color: #ef4444; }
        .feedback .hint { font-size: 16px; opacity: 0.9; font-weight: normal; }
        .feedback .reveal { font-size: 32px; color: #f59e0b; }

        /* INPUT BOX */
        #answer-input, .lookup-input {
            width: 100%;
            max-width: 600px;
            height: 65px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            box-shadow: 0 4px 0 var(--shadow-color), 0 6px 20px rgba(0,0,0,0.3);
            font-family: inherit;
            font-size: 24px;
            font-weight: bold;
            color: var(--input-text);
            text-align: center;
            outline: none;
            padding: 0 15px;
            transition: all 0.3s;
        }

        #answer-input::placeholder, .lookup-input::placeholder {
            color: #888;
        }

        #answer-input:disabled {
            opacity: 0.7;
            box-shadow: 0 1px 0 var(--shadow-color);
            transform: translateY(3px);
        }

        /* MAIN MENU */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 20;
            transition: all 0.3s;
        }

        #main-menu h1 {
            color: #fff;
            font-size: 48px;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
            line-height: 1.2;
        }

        .menu-columns {
            display: flex;
            gap: 40px;
            margin-bottom: 15px;
        }

        .menu-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .menu-column h2 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .menu-btn {
            width: 220px;
            height: 55px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            box-shadow: 0 4px 0 var(--shadow-color), 0 6px 12px rgba(0,0,0,0.2);
            font-family: inherit;
            font-size: 20px;
            font-weight: bold;
            color: var(--input-text);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s, background 0.3s;
        }

        .menu-btn:active {
            box-shadow: 0 1px 0 var(--shadow-color);
            transform: translateY(3px);
        }

        .back-to-menu-btn {
            width: 250px;
            height: 50px;
            font-size: 18px;
            margin-top: 10px;
        }

        /* LOOKUP MODE AREA */
        #lookup-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px 20px 20px;
            min-height: 0;
            z-index: 10;
        }

        .lookup-content {
            flex: 1;
            display: flex;
            gap: 20px;
            min-height: 0;
        }

        .lookup-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 15px;
            height: 100%;
        }

        .lookup-flag-box {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        .lookup-flag-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            transition: transform 0.2s ease-out;
            transform: scale(var(--flag-scale));
            display: none; /* Hidden until a match is found */
        }

        /* SETTINGS MODAL */
        #settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }

        .settings-content {
            background: var(--modal-bg);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
            color: var(--text-color);
        }

        .settings-content h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .setting-row {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .setting-row label {
            font-size: 18px;
            font-weight: bold;
        }

        /* SLIDER STYLING */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        
        input[type=range]:focus {
            outline: none;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            cursor: pointer;
            margin-top: -8px;
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
        }

        body.dark-mode input[type=range]::-webkit-slider-runnable-track {
            background: rgba(255,255,255,0.2);
        }

        .hidden {
            display: none !important;
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- Background Grid -->
    <div id="flag-grid-bg"></div>

    <!-- Main UI -->
    <div id="game-ui">
        
        <!-- Main Menu -->
        <div id="main-menu">
            <h1>World Quiz</h1>
            
            <div class="menu-columns">
                <!-- Flag Section -->
                <div class="menu-column">
                    <h2>Flags</h2>
                    <button class="menu-btn" data-mode="10" data-type="flag">10 Flags</button>
                    <button class="menu-btn" data-mode="25" data-type="flag">25 Flags</button>
                    <button class="menu-btn" data-mode="50" data-type="flag">50 Flags</button>
                    <button class="menu-btn" data-mode="all" data-type="flag">All Flags</button>
                </div>
                
                <!-- Map Section -->
                <div class="menu-column">
                    <h2>Maps</h2>
                    <button class="menu-btn" data-mode="10" data-type="map">10 Maps</button>
                    <button class="menu-btn" data-mode="25" data-type="map">25 Maps</button>
                    <button class="menu-btn" data-mode="50" data-type="map">50 Maps</button>
                    <button class="menu-btn" data-mode="all" data-type="map">All Maps</button>
                </div>
            </div>

            <button class="menu-btn" id="lookup-menu-btn" style="background: #4ade80; color: #000; border-color: #22c55e; box-shadow: 0 4px 0 #16a34a, 0 6px 12px rgba(0,0,0,0.2); margin-top: 10px;">Lookup Mode</button>
        </div>

        <!-- Game Area -->
        <div id="game-area" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
            
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="back-btn" id="back-btn">◀</div>
                <div class="top-stats">
                    <div id="score-display">Score: 0</div>
                    <div id="progress-display">1/25</div>
                </div>
                <div class="top-actions">
                    <div class="icon-btn" id="settings-btn" title="Settings">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </div>
                    <div class="icon-btn theme-toggle" id="theme-toggle" title="Toggle Theme">
                        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Flag Area (Default) -->
            <div class="flag-area" id="flag-area">
                <img id="flag-img" src="" alt="Flag">
            </div>

            <!-- Map Area (Hidden by default) -->
            <div id="map-area" class="hidden">
                <div id="chartdiv"></div>
            </div>

            <!-- Bottom Bar -->
            <div class="bottom-bar">
                <div class="feedback" id="feedback"></div>
                <input 
                    type="text" 
                    id="answer-input" 
                    placeholder="Type country name..." 
                    autocomplete="off" 
                    autocapitalize="off" 
                    autocorrect="off" 
                    spellcheck="false" 
                >
            </div>

        </div>

        <!-- Lookup Area -->
        <div id="lookup-area" class="hidden">
            <div class="top-bar">
                <div class="back-btn" id="lookup-back-btn">◀</div>
                <div style="font-size: 24px; flex: 1; text-align: center; padding-right: 40px; text-shadow: var(--text-shadow);">Lookup Mode</div>
            </div>
            <div class="lookup-content">
                <!-- Column 1 -->
                <div class="lookup-column">
                    <div class="lookup-flag-box">
                        <img id="lookup-flag-1" src="" alt="Flag 1">
                    </div>
                    <input type="text" class="lookup-input" id="lookup-input-1" placeholder="Country 1..." autocomplete="off" spellcheck="false">
                </div>
                <!-- Column 2 -->
                <div class="lookup-column">
                    <div class="lookup-flag-box">
                        <img id="lookup-flag-2" src="" alt="Flag 2">
                    </div>
                    <input type="text" class="lookup-input" id="lookup-input-2" placeholder="Country 2..." autocomplete="off" spellcheck="false">
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden">
        <div class="settings-content">
            <h2>Settings</h2>
            <div class="setting-row">
                <label>Flag Scale: <span id="scale-value">100%</span></label>
                <input type="range" id="scale-slider" min="20" max="100" value="100" step="5">
            </div>
            <button class="menu-btn" id="close-settings-btn">Close</button>
        </div>
    </div>

    <!-- Load Data File -->
    <script src="countries.js"></script>
    
    <script>
        // ---------------------------------------------------------------------------
        // Helpers & Setup
        // ---------------------------------------------------------------------------
        function normalize(str) {
            return str.trim().toLowerCase().replace(/[-]/g, ' ').replace(/\s+/g, ' ');
        }

        const ALL_COUNTRY_STRINGS = [];
        COUNTRIES.forEach(c => {
            ALL_COUNTRY_STRINGS.push(normalize(c.name));
            c.aliases.forEach(a => ALL_COUNTRY_STRINGS.push(normalize(a)));
        });
        const UNIQUE_COUNTRY_STRINGS = [...new Set(ALL_COUNTRY_STRINGS)];

        function isPrefixOfAnother(guess) {
            return UNIQUE_COUNTRY_STRINGS.some(str => str !== guess && str.startsWith(guess));
        }

        function generateBackground() {
            const bgContainer = document.getElementById('flag-grid-bg');
            if (!bgContainer) return;
            
            const codes = COUNTRIES.map(c => c.code);
            const totalFlags = 3000; 
            let html = '';
            
            for (let i = 0; i < totalFlags; i++) {
                const randomCode = codes[Math.floor(Math.random() * codes.length)];
                html += `<img src="https://flagcdn.com/w80/${randomCode}.png" alt="" loading="eager">`;
            }
            bgContainer.innerHTML = html;
        }

        function flagUrl(code) {
            return 'https://flagcdn.com/w1280/' + code + '.png';
        }

        const preloaded = new Set();
        function preloadFlag(code) {
            if (preloaded.has(code)) return;
            preloaded.add(code);
            const img = new Image();
            img.src = flagUrl(code);
        }

        function findCountry(str) {
            const guess = normalize(str);
            if (!guess) return null;
            return COUNTRIES.find(c => 
                normalize(c.name) === guess || 
                c.aliases.some(a => normalize(a) === guess)
            );
        }

        // ---------------------------------------------------------------------------
        // Map Mode Logic (amCharts)
        // ---------------------------------------------------------------------------
        let chart = null;
        let polygonSeries = null;
        let currentHighlightedPolygon = null;

        function initMap() {
            if (chart) return; // Already initialized

            const root = am5.Root.new("chartdiv");
            
            root.setThemes([
                am5themes_Animated.new(root)
            ]);

            chart = root.container.children.push(am5map.MapChart.new(root, {
                panX: "none",
                panY: "none",
                projection: am5map.geoMercator(),
                background: am5.Rectangle.new(root, { fill: am5.color(0x000000), fillOpacity: 0 }) // Transparent background
            }));

            polygonSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {
                geoJSON: am5geodata_worldLow,
                exclude: ["AQ"] // Exclude Antarctica
            }));

            polygonSeries.mapPolygons.template.setAll({
                fill: am5.color(getComputedStyle(document.documentElement).getPropertyValue('--map-country-fill').trim()),
                stroke: am5.color(getComputedStyle(document.documentElement).getPropertyValue('--map-country-stroke').trim()),
                strokeWidth: 0.5,
                tooltipText: "{name}"
            });

            // Disable dragging and zooming for a fixed view
            chart.seriesContainer.draggable = false;
            chart.seriesContainer.resizable = false;
            chart.set("zoomLevel", 1);
        }

        function updateMapTheme() {
            if (!polygonSeries) return;
            const isDark = document.body.classList.contains('dark-mode');
            const fill = isDark ? "#334155" : "#2c3e50";
            const stroke = isDark ? "#1e293b" : "#1a252f";
            
            polygonSeries.mapPolygons.each((polygon) => {
                if (polygon !== currentHighlightedPolygon) {
                    polygon.set("fill", am5.color(fill));
                    polygon.set("stroke", am5.color(stroke));
                }
            });
        }

        function highlightCountry(code) {
            if (!polygonSeries) return;

            // Reset previous highlight
            if (currentHighlightedPolygon) {
                const isDark = document.body.classList.contains('dark-mode');
                currentHighlightedPolygon.set("fill", am5.color(isDark ? "#334155" : "#2c3e50"));
                currentHighlightedPolygon.set("stroke", am5.color(isDark ? "#1e293b" : "#1a252f"));
            }

            // Find the polygon for the given ISO code (amCharts uses uppercase ISO codes)
            const dataItem = polygonSeries.getDataItemById(code.toUpperCase());
            
            if (dataItem) {
                const polygon = dataItem.get("mapPolygon");
                if (polygon) {
                    const highlightColor = getComputedStyle(document.documentElement).getPropertyValue('--map-highlight-fill').trim();
                    polygon.set("fill", am5.color(highlightColor));
                    polygon.set("stroke", am5.color("#000000"));
                    currentHighlightedPolygon = polygon;
                }
            } else {
                console.warn("Country not found on map:", code);
            }
        }

        // ---------------------------------------------------------------------------
        // Game State
        // ---------------------------------------------------------------------------
        let remaining = [];
        let current = null;
        let score = 0;
        let currentIndex = 0;
        let totalQuestions = 25;
        let isPlaying = false;
        let currentMode = 'flag'; // 'flag' or 'map'
        
        let answered = false;
        let answeredCorrect = false;

        // DOM Elements
        const flagImg = document.getElementById('flag-img');
        const answerInput = document.getElementById('answer-input');
        const feedbackEl = document.getElementById('feedback');
        const scoreDisplay = document.getElementById('score-display');
        const progressDisplay = document.getElementById('progress-display');
        
        const mainMenu = document.getElementById('main-menu');
        const gameArea = document.getElementById('game-area');
        const lookupArea = document.getElementById('lookup-area');
        const flagArea = document.getElementById('flag-area');
        const mapArea = document.getElementById('map-area');
        
        const backBtn = document.getElementById('back-btn');
        const lookupBackBtn = document.getElementById('lookup-back-btn');
        const themeToggle = document.getElementById('theme-toggle');
        
        // Settings DOM Elements
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const scaleSlider = document.getElementById('scale-slider');
        const scaleValue = document.getElementById('scale-value');

        // Lookup DOM Elements
        const lookupMenuBtn = document.getElementById('lookup-menu-btn');
        const lookupInput1 = document.getElementById('lookup-input-1');
        const lookupInput2 = document.getElementById('lookup-input-2');
        const lookupFlag1 = document.getElementById('lookup-flag-1');
        const lookupFlag2 = document.getElementById('lookup-flag-2');

        // ---------------------------------------------------------------------------
        // Game Flow
        // ---------------------------------------------------------------------------
        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function preloadUpcoming() {
            for (let i = 0; i < Math.min(5, remaining.length); i++) {
                preloadFlag(remaining[remaining.length - 1 - i].code);
            }
        }

        function showMenu() {
            isPlaying = false;
            mainMenu.classList.remove('hidden');
            gameArea.classList.add('hidden');
            lookupArea.classList.add('hidden');
        }

        function startGame(mode, type = 'flag') {
            isPlaying = true;
            currentMode = type;
            mainMenu.classList.add('hidden');
            lookupArea.classList.add('hidden');
            gameArea.classList.remove('hidden');
            
            // Toggle UI based on mode
            if (type === 'map') {
                flagArea.classList.add('hidden');
                mapArea.classList.remove('hidden');
                // Delay map init slightly to allow DOM to render
                setTimeout(initMap, 50); 
            } else {
                flagArea.classList.remove('hidden');
                mapArea.classList.add('hidden');
            }
            
            totalQuestions = mode === 'all' ? COUNTRIES.length : parseInt(mode);
            remaining = shuffle(COUNTRIES);
            score = 0;
            currentIndex = 0;
            
            updateTopBar();
            preloadUpcoming();
            nextFlag();
        }

        function nextFlag() {
            if (currentIndex >= totalQuestions) {
                isPlaying = false;
                answered = true;
                answerInput.disabled = true;
                feedbackEl.className = 'feedback correct';
                feedbackEl.innerHTML = `
                    <div class="reveal">Finished!</div>
                    <div>Final Score: ${score} / ${totalQuestions}</div>
                    <button class="menu-btn back-to-menu-btn" id="finish-menu-btn">Main Menu</button>
                `;
                document.getElementById('finish-menu-btn').addEventListener('click', showMenu);
                return;
            }

            if (remaining.length === 0) {
                remaining = shuffle(COUNTRIES);
            }

            current = remaining.pop();
            currentIndex++;
            answered = false;
            answeredCorrect = false;

            if (currentMode === 'map') {
                highlightCountry(current.code);
            } else {
                flagImg.src = flagUrl(current.code);
                flagImg.alt = 'Flag';
                flagImg.style.opacity = '1';
            }

            answerInput.value = '';
            answerInput.disabled = false;
            feedbackEl.className = 'feedback';
            feedbackEl.innerHTML = '';
            
            updateTopBar();
            answerInput.focus();
            preloadUpcoming();
        }

        function updateTopBar() {
            scoreDisplay.textContent = `Score: ${score}`;
            progressDisplay.textContent = `${currentIndex}/${totalQuestions}`;
        }

        function isCorrectGuess(guess) {
            return (
                guess === normalize(current.name) ||
                current.aliases.some(a => normalize(a) === guess)
            );
        }

        function submitAnswer() {
            if (answered) {
                if (currentIndex < totalQuestions) {
                    nextFlag();
                }
                return;
            }

            const guess = normalize(answerInput.value);
            if (!guess) return;

            answered = true;
            answerInput.disabled = true;

            if (isCorrectGuess(guess)) {
                answeredCorrect = true;
                score++;
                updateTopBar();
                feedbackEl.className = 'feedback correct';
                feedbackEl.innerHTML = `<div>✅ ${current.name}</div><div class="hint">Enter / Space for next</div>`;
            } else {
                answeredCorrect = false;
                feedbackEl.className = 'feedback wrong';
                feedbackEl.innerHTML = `<div>❌ Not quite</div><div class="reveal">${current.name}</div><div class="hint">↓ to override · Enter / Space for next</div>`;
            }
        }

        function overrideCorrect() {
            if (!answered || answeredCorrect || !isPlaying) return;
            answeredCorrect = true;
            score++;
            updateTopBar();
            feedbackEl.className = 'feedback correct';
            feedbackEl.innerHTML = `<div>⭐ Overridden — ${current.name}</div><div class="hint">Enter / Space for next</div>`;
        }

        // ---------------------------------------------------------------------------
        // Lookup Logic
        // ---------------------------------------------------------------------------
        function showLookup() {
            isPlaying = false;
            mainMenu.classList.add('hidden');
            gameArea.classList.add('hidden');
            lookupArea.classList.remove('hidden');
            
            lookupInput1.value = '';
            lookupInput2.value = '';
            lookupFlag1.style.display = 'none';
            lookupFlag2.style.display = 'none';
            lookupFlag1.src = '';
            lookupFlag2.src = '';
            
            lookupInput1.focus();
        }

        function handleLookupInput(inputEl, imgEl) {
            const val = inputEl.value;
            const country = findCountry(val);
            if (country) {
                imgEl.src = flagUrl(country.code);
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }
        }

        lookupInput1.addEventListener('input', () => handleLookupInput(lookupInput1, lookupFlag1));
        lookupInput2.addEventListener('input', () => handleLookupInput(lookupInput2, lookupFlag2));

        // ---------------------------------------------------------------------------
        // Settings & Theme Logic
        // ---------------------------------------------------------------------------
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('flagQuizTheme', isDark ? 'dark' : 'light');
            updateMapTheme();
        }

        function loadTheme() {
            const saved = localStorage.getItem('flagQuizTheme');
            if (saved === 'dark') {
                document.body.classList.add('dark-mode');
            }
        }

        function openSettings() {
            settingsModal.classList.remove('hidden');
        }

        function closeSettings() {
            settingsModal.classList.add('hidden');
        }

        function applyScale(val) {
            document.documentElement.style.setProperty('--flag-scale', val / 100);
            scaleValue.textContent = val + '%';
            localStorage.setItem('flagScale', val);
        }

        function loadSettings() {
            const savedScale = localStorage.getItem('flagScale') || 100;
            scaleSlider.value = savedScale;
            applyScale(savedScale);
        }

        scaleSlider.addEventListener('input', (e) => {
            applyScale(e.target.value);
        });

        settingsBtn.addEventListener('click', openSettings);
        closeSettingsBtn.addEventListener('click', closeSettings);
        
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeSettings();
        });

        themeToggle.addEventListener('click', toggleTheme);

        // Menu & Navigation Buttons
        document.querySelectorAll('.menu-btn[data-mode]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                startGame(e.target.dataset.mode, e.target.dataset.type);
            });
        });

        lookupMenuBtn.addEventListener('click', showLookup);
        backBtn.addEventListener('click', showMenu);
        lookupBackBtn.addEventListener('click', showMenu);

        document.addEventListener('keydown', (e) => {
            if (!isPlaying || !settingsModal.classList.contains('hidden')) return;

            if (e.key === ' ' || e.code === 'Space') {
                if (answered) {
                    e.preventDefault();
                    if (currentIndex < totalQuestions) {
                        nextFlag();
                    }
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (answered && !answeredCorrect) {
                    overrideCorrect();
                }
            } else if (e.key === 'Enter') {
                e.preventDefault();
                submitAnswer();
            }
        });

        // Auto-submit logic
        answerInput.addEventListener('input', () => {
            if (answered || !current || !isPlaying) return;
            
            const rawValue = answerInput.value;
            const guess = normalize(rawValue);
            if (!guess) return;

            if (isCorrectGuess(guess)) {
                if (rawValue.endsWith(' ') || !isPrefixOfAnother(guess)) {
                    submitAnswer();
                }
            }
        });

        // Initialize
        loadTheme();
        loadSettings();
        generateBackground();
        showMenu();
    </script>

</body>
</html>
